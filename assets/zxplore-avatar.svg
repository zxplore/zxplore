<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="zxplore">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6dffab"/>
      <stop offset=".5" stop-color="#3dff88"/>
      <stop offset="1" stop-color="#22e0e0"/>
    </linearGradient>
    <radialGradient id="bgg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#18222a"/>
      <stop offset="1" stop-color="#080b0d"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- circular tile (transparent outside) -->
  <circle cx="256" cy="256" r="242" fill="url(#bgg)"/>
  <circle cx="256" cy="256" r="240.5" fill="none" stroke="#2b3944" stroke-width="3"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#3dff88" stroke-opacity=".22" stroke-width="2"/>

  <!-- Z from stacked strata, scaled to breathe inside the circle -->
  <g transform="translate(256 256) scale(.84) translate(-256 -256)">
    <g filter="url(#glow)">
      <g fill="url(#zg)">
        <rect x="130" y="146" width="252" height="56" rx="9"/>
        <polygon points="382,146 382,202 150,366 150,310"/>
        <rect x="130" y="310" width="252" height="56" rx="9"/>
      </g>
    </g>
    <g stroke="#080b0d" stroke-width="4.5" opacity=".5" stroke-linecap="round">
      <line x1="146" y1="174" x2="366" y2="174"/>
      <line x1="146" y1="338" x2="366" y2="338"/>
    </g>
  </g>
</svg>
