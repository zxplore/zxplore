# staticcheck.conf — checks for `staticcheck ./...` (CI runs it on every push).
#
# ST1005 (error strings must be lowercase, no trailing punctuation) is aimed
# at terse programmatic errors that get wrapped into longer chains. zxplore
# deliberately returns user-facing dialog prose from auth/connection failures —
# full sentences with recovery guidance (see servers.go sshAuthHint). Silencing
# the check beats degrading those messages. Everything else stays on.
checks = ["inherit", "-ST1005"]
